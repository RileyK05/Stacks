# Builds the Windows installer after the CI gate passes.
#
# - Push a tag `vX.Y.Z` (matching src/backend/version.py): the installer is
#   attached to a draft GitHub release, with that version's CHANGELOG
#   section as its notes. Review the draft, then publish it.
# - Run it by hand (Actions → Release → Run workflow): the installer is
#   kept as a workflow artifact only, for testing a build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  installer:
    name: Windows installer
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Version
        id: version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/backend/version.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version (run scripts/set_version.py first)"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install -e ".[desktop]"
          npm ci --prefix src/frontend
      - name: Build installer
        run: python -m scripts.build_desktop

      - uses: actions/upload-artifact@v4
        with:
          name: stacks-${{ steps.version.outputs.version }}-windows
          path: src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'EOF' > release-notes.md
          import os, re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = re.escape(os.environ["VERSION"])
          match = re.search(rf"^## \[{version}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else "See CHANGELOG.md.")
          EOF
          gh release create "$GITHUB_REF_NAME" \
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe \
            --draft --title "Stacks $VERSION" --notes-file release-notes.md
