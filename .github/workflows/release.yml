# Builds the Windows installer after the CI gate passes (macOS and Linux:
# release-macos-linux.yml).
#
# - Push a tag `vX.Y.Z` (matching src/backend/version.py): the installer is
#   attached to a draft GitHub release, with that version's CHANGELOG
#   section as its notes. Review the draft, then publish it.
# - Run it by hand (Actions → Release → Run workflow): the installer is
#   kept as a workflow artifact only, for testing a build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  installer:
    name: Windows installer
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Version
        id: version
        run: |
          version=$(python -c "from src.backend.version import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version (run scripts/set_version.py first)"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install -e ".[desktop]"
          npm ci --prefix src/frontend
      - name: Build installer
        run: python -m scripts.build_desktop

      - uses: actions/upload-artifact@v4
        with:
          name: stacks-${{ steps.version.outputs.version }}-windows
          path: src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # The macOS/Linux workflow attaches to the same release and may have
      # created the draft first; either way it exists before the upload.
      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m scripts.release_notes "$VERSION" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Stacks $VERSION" --notes-file release-notes.md || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
