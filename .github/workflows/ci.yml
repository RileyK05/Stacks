# The gate: every push and pull request must pass these before it counts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# github.workflow is the caller's name when a release workflow runs this as
# its gate, so two releases on one tag don't cancel each other's gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
          - name: Linux x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Linux runtime library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Ruff
        run: python -m ruff check .
      - name: Python formatting
        run: python -m ruff format --check src/backend scripts tests
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend and shell / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
          - name: Linux x64
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/office-addin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri
      - name: Install
        run: |
          python -m pip install -e .
          npm ci --prefix src/frontend
          npm ci --prefix src/office-addin
      - name: Linux Tauri libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file
      # schema.d.ts is generated, not committed: dump the backend's API
      # spec and build the frontend types from it.
      - name: API types
        run: |
          python -m scripts.dump_openapi runs/openapi.json
          cd src/frontend && OPENAPI_FILE=../../runs/openapi.json npm run gen:api
      - name: svelte-check
        run: npm run check --prefix src/frontend
      - name: Editor recovery behavior
        run: npm test --prefix src/frontend
      # The pane is plain JS: type-check it against Microsoft's Office.js
      # types (an Office API that doesn't exist fails here, not in Word)
      # and run its logic tests.
      - name: Office add-in
        run: |
          npm run check --prefix src/office-addin
          npm test --prefix src/office-addin
      # The shell embeds the built SPA, so the build comes before clippy.
      - name: Build SPA
        run: npm run build --prefix src/frontend
      - name: Clippy
        working-directory: src/frontend/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
