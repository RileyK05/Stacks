[version]
retrieval_config_version = "4"

[funnel]
# Per-seam candidate limits before fusion.
keyword_limit = 20
graph_limit = 10
generated_lookup_weight = 0.35
embedding_limit = 15
# Final cited set size after fusion.
final_k = 10
# How many embedding-only candidates (found by no other layer) may enter
# the final set. 0 disables semantic expansion.
embedding_only_quota = 3

[rerank]
# Cross-encoder stage between retrieval and generation (plan §5.3, §6.4):
# scores every fused candidate against the question, puts the best first,
# and keeps only `generation_k` for the prompt. A small model reads fewer,
# better chunks: shorter prompts (faster on a laptop CPU) and the answering
# chunk up front (the Phase 0 over-refusal failure). Falls back to the
# fused order if the reranker cannot load.
enabled = true
model = "cross-encoder/ms-marco-MiniLM-L6-v2"
generation_k = 6
# Score mode (plan-score-retrieval.md Phase 3): wide pool, cross-encoder
# score every anchor, keep what clears the floor. Ships "top_k" until the
# floor is calibrated with scripts/calibrate_rerank.py. The sentinel floor
# values keep everything.
mode = "top_k"
pool_limit = 60
min_score = -1000.0
max_drop = 1000.0

[score]
# Wide per-seam limits used only in score mode.
keyword_limit = 50
embedding_limit = 50
graph_limit = 20

[route]
# Explicit-address routing (plan-score-retrieval.md Phase 1). A question that
# names "Table 2.2" or "Week 3" is filtered to that passage or that week's
# sources; a label that is not found fails open.
enabled = true
label_kinds = [
  "table", "figure", "fig", "chart", "exhibit", "equation", "eq",
  "theorem", "lemma", "definition", "example", "exercise", "problem",
  "section", "chapter",
]
label_limit = 5
# A question naming a source by a distinctive filename word (an author such
# as "Resendez", accent-insensitive) is filtered to that source: book pages
# rarely print the author's name, so neither keyword nor embedding search
# can find "the Resendez reading" otherwise. Generic filename words that a
# question uses casually are not names. Fails open when nothing matches.
name_min_chars = 4
name_stopwords = [
  "week", "weeks", "chapter", "chapters", "part", "parts", "pages", "final",
  "draft", "copy", "version", "searchable", "scan", "scanned", "slides",
  "slide", "lecture", "lectures", "reading", "readings", "notes", "note",
  "handout", "intro", "introduction", "review", "exam", "exams", "quiz",
  "homework", "assignment", "problem", "problems", "solutions", "midterm",
  "study", "guide", "class", "course", "unit", "module",
]

