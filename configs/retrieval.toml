[version]
retrieval_config_version = "2"

[funnel]
# Per-seam candidate limits before fusion.
keyword_limit = 20
toc_limit = 20
dependency_limit = 15
embedding_limit = 15
# Final cited set size after fusion.
final_k = 10
# How many embedding-only candidates (found by no other layer) may enter
# the final set. 0 disables semantic expansion.
embedding_only_quota = 3

[rerank]
# Cross-encoder stage between retrieval and generation (plan §5.3, §6.4):
# scores every fused candidate against the question, puts the best first,
# and keeps only `generation_k` for the prompt. A small model reads fewer,
# better chunks: shorter prompts (faster on a laptop CPU) and the answering
# chunk up front (the Phase 0 over-refusal failure). Falls back to the
# fused order if the reranker cannot load.
enabled = true
model = "cross-encoder/ms-marco-MiniLM-L6-v2"
generation_k = 6

