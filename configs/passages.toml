version = "3"
semantic_enabled = true
target_tokens = 512
# A block shorter than this, and not already a sentence, is merged into a
# neighbor. Empty headings and running-head fragments were being embedded.
min_alnum_chars = 40
boundary_similarity = 0.78
search_window_tokens = 512
retrieved_passage_tokens = 2048
generation_material_tokens = 6144
window_overlap_tokens = 64
context_neighbors = 2
context_similarity = 0.72
similarity_neighbors = 8
similarity_floor = 0.78
similarity_block_rows = 128
