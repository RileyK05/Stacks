[version]
models_config_version = "2"

# Provider presets (docs/plan-local-first.md §7, plan-notebook §4.8): the
# templates a connection is made from. The user adds connections in
# Settings (as many as they like, each with its own key in the OS
# keyring) and picks a connection + model per task or per chat.
# `key_env` names development environment variables read, in order, only
# when the keyring holds no key for the connection.
# `disclosure = true` means using it sends course excerpts off this
# machine, and the UI says so once — it is the user's choice. Every
# endpoint below speaks the OpenAI chat-completions API.

[presets.local]
label = "Local model (runs on this computer)"
base_url = "http://127.0.0.1:8081/v1"
default_model = "minicpm5-2b"
requires_key = false
disclosure = false

[presets.openai]
label = "OpenAI"
base_url = "https://api.openai.com/v1"
default_model = ""
requires_key = true
disclosure = true

# Anthropic is called through the official SDK (Messages API), not the
# OpenAI-compatible shim; base_url is passed explicitly so an ambient
# ANTHROPIC_BASE_URL never redirects the app's traffic.
[presets.anthropic]
label = "Anthropic"
base_url = "https://api.anthropic.com"
default_model = "claude-opus-5-5"
requires_key = true
disclosure = true
key_env = ["ANTHROPIC_API_KEY", "ANT_KEY"]

[presets.google]
label = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
default_model = ""
requires_key = true
disclosure = true

[presets.openrouter]
label = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
default_model = "nvidia/nemotron-3.5-lightning:free"
requires_key = true
disclosure = true

[presets.groq]
label = "Groq"
base_url = "https://api.groq.com/openai/v1"
default_model = ""
requires_key = true
disclosure = true

[presets.ollama_cloud]
label = "Ollama Cloud"
base_url = "https://ollama.com/v1"
default_model = "mimo-v2.6-flash"
requires_key = true
disclosure = true
key_env = ["OLLAMA_API_KEY", "OLLAMA_KEY"]

# Runners on this computer: nothing leaves the machine.
[presets.lmstudio]
label = "LM Studio"
base_url = "http://127.0.0.1:1234/v1"
default_model = ""
requires_key = false
disclosure = false

[presets.ollama]
label = "Ollama"
base_url = "http://127.0.0.1:11434/v1"
default_model = ""
requires_key = false
disclosure = false

[presets.custom]
label = "Custom OpenAI-compatible endpoint"
base_url = ""
default_model = ""
requires_key = false
accepts_key = true
disclosure = true

# Generation defaults. Small local models deliberate at length when
# allowed (plan §3), and llama.cpp ignores JSON-schema constraints while
# thinking is on, so thinking is off unless a profile turns it on.
[generation]
temperature = 0.2
max_output_tokens = 2048
enable_thinking = false
# How plain questions are answered: "plain" ([n] markers) or "quotes"
# (verified literal quotes first; tutor/quotes.py). Chosen by measurement
# (scripts/eval_models.py --answer-mode).
answer_mode = "plain"
request_timeout_seconds = 600
