# Model catalog (plan §5.1–5.2). Q4_K_M quantizations; checksums are the
# Hugging Face LFS sha256 values. `min_ram_gb` is the machine RAM below
# which the app warns before downloading. Model choices are provisional
# until the Phase 0 bake-off (decision 012).
#
# Only architectures the pinned llama.cpp build supports are listed.
# K2 Horizon (arch "k2-horizon") is NOT supported by upstream llama.cpp at
# b11177 — LM Studio ships a patched runtime — so it is reachable through
# the "custom" provider preset pointed at LM Studio, not bundled here.

[[models]]
id = "minicpm5-2b"
label = "MiniCPM5 2B"
tier = "starter"
repo = "openbmb/MiniCPM5-2B-GGUF"
file = "MiniCPM5-2B-Q4_K_M.gguf"
sha256 = "ec2d5801640099e97d8d7e8003ad4d81f336e757811f03a26173dddf386602fd"
size_bytes = 1561318368
min_ram_gb = 8
license = "Apache-2.0"
notes = "Default. Fast on laptops; strong for its size."

