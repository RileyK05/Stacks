[version]
runtime_config_version = "1"

# The bundled local model server (docs/plan-local-first.md §5.2, §11).
# The llama.cpp build is pinned: a new build is adopted only after the
# eval set passes on it (new architectures have regressed across builds).
[llama_cpp]
build = "b11177"
port = 8081
context_size = 8192
# Server-side thinking kill-switch. Runners disagree on the per-request
# switch (LM Studio ignored enable_thinking; MiniCPM5-2B then spent a
# whole 2048-token budget thinking and answered nothing — plan §3), so
# the bundled server disables reasoning outright.
reasoning_budget = 0
startup_timeout_seconds = 180

# One archive per platform + accelerator. Vulkan covers Intel, AMD and
# NVIDIA GPUs (including integrated ones); the CPU build is the fallback
# when no Vulkan driver is present.
[llama_cpp.assets.windows-x64-vulkan]
file = "llama-b11177-bin-win-vulkan-x64.zip"
sha256 = "6e4e7a8cea0d2dbd0a745b55f6b42d46d8130f8df4791938802f8269dfc205d5"
size_bytes = 32456717

[llama_cpp.assets.windows-x64-cpu]
file = "llama-b11177-bin-win-cpu-x64.zip"
sha256 = "7f11f910c9ef590782a0a0edbaa99aac1665823ab7bbd63830eca97c39e8defc"
size_bytes = 18568210

[llama_cpp.assets.macos-arm64]
file = "llama-b11177-bin-macos-arm64.tar.gz"
sha256 = "815f8f3ddc8f57ceb792fed561bd6a6c6bd590578f3ad38604e7f70c49de1ac1"
size_bytes = 11202247

[llama_cpp.assets.linux-x64-vulkan]
file = "llama-b11177-bin-ubuntu-vulkan-x64.tar.gz"
sha256 = "1557dbc00d446cb21d7e9771d98106495f55d8cef4faff85ee479eef3698d0c3"
size_bytes = 30951748

[llama_cpp.assets.linux-x64-cpu]
