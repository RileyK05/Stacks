pipeline_version = "2"
max_attempts = 2
chunk_max_tokens = 512
prompt_window_chars = 8000
# The ingestion worker's own poll interval (review catch #7: it was
# sharing lifecycle's maintenance_interval_seconds = 3600, so uploads
# waited up to an hour). This knob is the ingestion loop's; the worker
# wakes on upload regardless (an asyncio Event set by the upload path).
poll_interval_seconds = 5

[[stages]]
name = "extract_text"
handler_version = "1"

[[stages]]
name = "build_locators"
handler_version = "1"

[[stages]]
name = "build_chunks"
handler_version = "1"

[[stages]]
name = "embed_chunks"
handler_version = "1"

[[stages]]
name = "update_toc"
handler_version = "1"

[[stages]]
name = "extract_knowledge"
handler_version = "1"