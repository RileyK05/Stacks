[version]
lifecycle_config_version = "5"

[trash]
# A deleted course stays restorable for this long, then is purged (its
# course-memory keepsake survives). User-configurable later via
# app_settings; this is the default.
retention_days = 30
maintenance_interval_seconds = 3600

[memory]
summary_version = "deterministic-v1"
summary_base_tokens = 800
max_tokens = 5000

[uploads]
# Largest single upload accepted. Local disk is the only cost; this bound
# keeps one mistaken drag-and-drop from filling it.
max_raw_upload_bytes = 1073741824

[archive]
# `.course` import bounds: the archive itself, the sum of its files once
# unzipped (each file is also held to max_raw_upload_bytes), and how many
# files one course may carry.
max_import_bytes = 4294967296
max_import_sources = 1000

[decompression]
# Hard ceiling on unzipped bytes per stored source. MUST stay >=
# max_raw_upload_bytes: stored files are our gzip of a body that already
# passed that ceiling, so legitimate expansion reaches at least that size.
# The invariant is pinned by test_decompression_cap_covers_raw_upload_ceiling.
max_decompressed_bytes = 1073741824

[cleanup]
# Files younger than this are never swept as orphans: an in-flight upload
# holds its file open only for seconds, so a full hour is safely conservative.
orphan_min_age_seconds = 3600
