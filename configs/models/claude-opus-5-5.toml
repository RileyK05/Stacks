# Claude Opus 5.5 through the native Anthropic path. Thinking cannot be
# turned off on this model; effort is the only depth control and its API
# default is medium, so it is pinned here rather than left implicit.
model = "claude-opus-5-5"
reasoning = true
max_output_tokens = 32000
output_token_limit = 128000
context_window_tokens = 1000000
effort = "medium"
refusal_fallback = true
