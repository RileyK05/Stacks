[version]
auth_config_version = "1"

[login_throttle]
# Failed logins allowed against one key (account email, or source IP)
# within window_seconds before the key locks for lockout_seconds. Both
# keys are always counted; a key locks independently.
max_failures = 5
window_seconds = 900
lockout_seconds = 900
# When the app runs behind a reverse proxy, the socket peer is the proxy
# and per-IP throttling would lock out every user at once. Set true ONLY
# when a trusted proxy strips/sets X-Forwarded-For and the app is not
# directly reachable; the left-most entry is then treated as the client.
trust_forwarded_for = false
