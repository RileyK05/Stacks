[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-assistant"
version = "0.1.0"
description = "Local-first course memory and adaptive study system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=./.pytest_tmp"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# pypdfium2 ships no type stubs; the OCR rasterizer is the only caller and
# is covered by tests, so the untyped boundary is accepted here.
module = "pypdfium2.*"
ignore_missing_imports = true
