[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-assistant"
version = "0.1.0"
description = "Local-first course memory and adaptive study system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    # pypdf needs fontTools to decode CFF/Type1 font encodings; without it
    # extracted text is full of U+FFFD replacement characters.
    "fonttools>=4.50",
    "Pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "keyring>=25",
    # In-process encoders (embeddings, reranker) — no torch at runtime.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# The torch reference implementation of the encoders, only needed to run
# scripts/check_encoders.py (ONNX ↔ torch parity).
parity = [
    "sentence-transformers>=5.0",
]
desktop = [
    "pywebview>=5",
    "pyinstaller>=6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=./.pytest_tmp"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# pypdfium2 ships no type stubs; the OCR rasterizer is the only caller and
# is covered by tests, so the untyped boundary is accepted here.
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime ships no type stubs; common/encoders.py is its only caller
# and its output is checked against torch by scripts/check_encoders.py.
module = "onnxruntime.*"
ignore_missing_imports = true
