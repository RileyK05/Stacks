<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacks</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./taskpane.css" />
  </head>
  <body>
    <main>
      <header>
        <h1><img src="./assets/icon-32.png" alt="" width="18" height="18" /> Stacks</h1>
        <p id="status" class="status" role="status" aria-live="polite">Starting…</p>
        <button id="retry" type="button" class="secondary" hidden>Retry</button>
      </header>

      <section class="panel">
        <label class="label" for="course">Course</label>
        <select id="course"></select>
      </section>

      <section class="panel">
        <div class="row">
          <label class="label" for="selection">Looking at</label>
          <button id="refresh" type="button" class="link">Read selection again</button>
        </div>
        <textarea id="selection" rows="5" placeholder="Select something in your document, or type here."></textarea>
      </section>

      <section class="actions" id="actions">
        <button type="button" data-action="explain">Explain</button>
        <button type="button" data-action="find">Find in my course</button>
        <button type="button" data-action="quiz">Quiz me</button>
        <button type="button" data-action="summarize">Summarize</button>
      </section>

      <section class="panel">
        <label class="label" for="question">Or ask a question</label>
        <div class="ask">
          <input id="question" type="text" placeholder="e.g. How does this connect to lecture 3?" />
          <button id="ask" type="button" class="primary">Ask</button>
        </div>
      </section>

      <section class="panel" id="answer-panel" hidden>
        <span class="label">Stacks</span>
        <div id="result" class="answer"></div>
        <ul id="citations" class="citations"></ul>
        <div class="actions">
          <button id="insert" type="button" class="primary" disabled>Insert</button>
          <button id="replace" type="button" disabled>Replace</button>
        </div>
        <p id="engine" class="muted"></p>
      </section>
    </main>
    <script type="module" src="./taskpane.js"></script>
  </body>
</html>
