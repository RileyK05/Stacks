[package]
name = "stacks"
version = "0.2.0"
description = "Stacks: a study tool that runs on your own laptop"
authors = ["Riley Kehoe"]
license = "MIT"
repository = "https://github.com/RileyK05/Stacks"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stacks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
