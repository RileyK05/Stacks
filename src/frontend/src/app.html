<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacks</title>
    <script>
      // Pre-paint theme (mirrors $lib/stores/theme.svelte.ts) so dark-mode
      // users never see a flash of the light theme before the app boots.
      try {
        const stored = localStorage.getItem('theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
    <style>
      /* Shown while the backend starts; the root layout removes it. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 500 14px/1 system-ui, sans-serif;
        color: #6b6660;
        background: #f8f6f2;
      }
      .dark #boot-splash {
        color: #aaa59e;
        background: #141312;
      }
      #boot-splash span {
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" role="status"><span></span>Starting Stacks…</div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
